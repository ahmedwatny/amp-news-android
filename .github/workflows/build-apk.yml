
name: Build AMP News APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f AMPNewsAndroid/settings.gradle ]; then
            echo "PROJECT_DIR=AMPNewsAndroid" >> "$GITHUB_ENV"
          else
            echo "Could not find settings.gradle"
            find . -maxdepth 3 -name settings.gradle
            exit 1
          fi

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMP-News-debug-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
